name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same PR should cancel the run already in flight rather than queue
# behind it — nobody wants CI results for a commit they've already superseded. Master pushes
# get their own group per run (github.run_id), not shared by ref: under the release-gated
# deploy below, a cancelled -- or merely queued-then-superseded -- master run is no longer
# self-healing the way it was when every push deployed. GitHub cancels a run that's still
# *pending* in an occupied group the moment a new one queues into it, not only one already
# running, so cancel-in-progress: false alone still lets a second superseding push strand a
# push that already turned into a tagged release (release_created only flips true once, on
# the commit that actually created it). Keying master's group on run_id makes every master
# push its own group -- never queued, never cancelled. See
# docs/specs/2026-09-10-semver-release-design.md.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. Nothing in this workflow writes to the repo with GITHUB_TOKEN: the one job
# that writes (release-please) does it with a GitHub App token minted inside the `release`
# environment, and its own GITHUB_TOKEN has no permissions at all.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Mirrors the hand-run gate exactly: fmt --check, clippy -D warnings, then
  # cargo test. All three ran by hand against the same checkout, so they stay
  # one job rather than three — a fmt failure should still let clippy and
  # test report their own results in the same log. Also carries one
  # pre-toolchain repo-hygiene check (the .claude/skills assertion below) —
  # folded in here rather than a dedicated job because it needs no toolchain
  # and runs in well under a second; see
  # docs/specs/2026-09-10-ci-assert-skills-symlink-design.md.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Same image, user, db name and port-mapping rationale as compose.yaml:
      # `cargo test` runs `#[sqlx::test]` against a real Postgres, no mocks.
      # The service account is a superuser, matching local `podman compose`,
      # which is what lets the baseline migration create and grant `otto_app` and
      # exercise the explicit `SET LOCAL ROLE otto_app` guard the isolation tests pin.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: otto_factory
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U factory -d otto_factory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://factory:factory@localhost:15433/otto_factory
    steps:
      - uses: actions/checkout@v4

      # .claude/skills is a git-tracked symlink to ../.github/skills so Claude Code
      # discovers this repo's skills on a fresh clone (see savvagent/otto-factory#124);
      # nothing previously noticed if that symlink broke or got repointed
      # (savvagent/otto-factory#127). Reads the committed tree object rather than the
      # live filesystem for the first two checks so it still catches a broken commit
      # even under a checkout that didn't materialize the symlink. `$line`/`$target`
      # are read from a blob any PR author controls, so the *comparisons* below use
      # them byte-for-byte (an embedded newline must NOT be stripped before the
      # equality check, or a target differing only by an embedded newline would
      # wrongly compare equal) — only the copy that gets echoed into a `::error::`
      # workflow-command line is separately sanitized of embedded CR/LF, since
      # GitHub Actions parses any `::`-prefixed stdout line as a command and an
      # unsanitized value could inject a second one.
      - name: Assert .claude/skills resolves to .github/skills
        run: |
          set -euo pipefail
          line=$(git ls-tree HEAD .claude/skills)
          if [ -z "$line" ]; then
            echo "::error::.claude/skills does not exist in HEAD (expected a symlink)"
            exit 1
          fi
          fields=$(printf '%s' "$line" | cut -f1)
          mode=$(printf '%s' "$fields" | awk '{print $1}')
          type=$(printf '%s' "$fields" | awk '{print $2}')
          if [ "$mode" != "120000" ] || [ "$type" != "blob" ]; then
            safe_line=$(printf '%s' "$line" | tr -d '\n\r')
            echo "::error::.claude/skills is not a symlink blob in HEAD (git ls-tree: $safe_line)"
            exit 1
          fi
          target=$(git cat-file blob HEAD:.claude/skills)
          if [ "$target" != "../.github/skills" ]; then
            safe_target=$(printf '%s' "$target" | tr -d '\n\r')
            echo "::error::.claude/skills points at '$safe_target', expected '../.github/skills'"
            exit 1
          fi
          if [ ! -f .claude/skills/otto-tower-development/SKILL.md ]; then
            echo "::error::.claude/skills/otto-tower-development/SKILL.md not reachable through the symlink"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Pre-create the otto_app role
        # 0001_baseline.sql creates `otto_app` itself when it is missing, and
        # tolerates losing the race to do so. This step is not a requirement,
        # only a way to take that race out of CI: `#[sqlx::test]` migrates one
        # throwaway database per test, many in parallel, against this one
        # cluster-scoped role, and the database that loses the creation race
        # would otherwise be retrying instead of testing. (The squashed
        # baseline replaced a three-role rename history that needed df_app,
        # of_app and otto_app all pre-created; see migrate.rs.)
        run: psql "$DATABASE_URL" -c "CREATE ROLE otto_app NOLOGIN;"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Mirrors web/README's three commands: check (svelte-check + tsc over
  # worker/), lint (prettier --check), test (vitest). No build here — the
  # build step has no gate of its own beyond these three, and of-server's own
  # startup requires `web/` to be built first, not CI.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm run lint

      - run: npm test

  # Proves the deploy artifact actually builds. cargo test above can stay
  # green while the container fails if the host has OpenSSL headers the image
  # build stage lacks, so this job closes that gap by proving Dockerfile
  # itself builds.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check for image-relevant changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image:
              - 'Dockerfile'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'web/**'

      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push' || steps.filter.outputs.image == 'true'

      - name: Build image
        if: github.event_name == 'push' || steps.filter.outputs.image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Enforces Conventional Commits on PR titles, which become the master commit on squash-merge --
  # release-please's version-bump computation reads a commit's type (feat/fix/...), so a title
  # release-please can't parse is silently excluded from the changelog and the version bump. See
  # docs/specs/2026-09-10-semver-release-design.md §2 and CLAUDE.md's "Releases & versioning".
  pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            of-core
            otto-platform
            of-mcp
            of-billing
            of-trackers
            of-web
            of-server
            of-testkit
            web
            docs
            ci
            release
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$

  # Computes the next SemVer version and CHANGELOG.md entry from Conventional Commits history
  # since the last release, and maintains a single "chore: release X.Y.Z" PR carrying that bump.
  # On an ordinary push this just updates that PR (release_created stays false). When the PR
  # itself is merged, release-please recognizes its own commit, cuts the git tag + GitHub
  # Release, and release_created becomes true -- the signal `deploy` below gates on. See
  # docs/specs/2026-09-10-semver-release-design.md §1.
  release-please:
    runs-on: ubuntu-latest
    needs: [rust, web, docker-build]
    # Its own explicit guard, not just on.push.branches -- this job mints a release-app token
    # with contents + pull-requests write, more than deploy's own contents:read + one app-scoped
    # Fly token, so it earns the same "don't lean on the trigger block" treatment deploy's if:
    # gets below.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 10
    # The writes (release PR, labels, tag, GitHub Release) go through the otto-tower-release
    # GitHub App's installation token, not GITHUB_TOKEN: the repo setting that would let
    # GITHUB_TOKEN open a pull request ("Allow GitHub Actions to create and approve pull
    # requests") is one switch with approving one, and it is off so a compromised workflow
    # token cannot approve a PR (savvagent/otto-factory#117). A side effect is that release PRs
    # now run CI, which PRs opened by GITHUB_TOKEN never trigger -- and so would a tag or a
    # Release it creates, so any future `on: release` / `on: push: tags` workflow fires on every
    # release and needs a guard of its own.
    #
    # The `if:` above is text in a file any branch can edit, so it cannot keep the App's private
    # key from a same-repo branch's own copy of this workflow. The `release` environment can: it
    # admits only `master`, and the key is an environment secret, never a repository one.
    environment: release
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Automates docs/deploy/fly.md's manual `fly deploy -a otto-factory-mcp`: only a push that
  # release-please just turned into a real release (tag + GitHub Release cut) deploys --
  # deploying on every push to master is what release-please's version gate replaces. flyctl
  # builds remotely on Fly's own builder (--remote-only), the same path a human runs by hand --
  # this job doesn't reuse docker-build's image (that job never pushes anywhere; see its own
  # design spec) so the image is built twice, which is an accepted tradeoff for keeping this to
  # one job and one new secret.
  deploy:
    runs-on: ubuntu-latest
    needs: [release-please]
    # A deploy credential deserves its own predicate, not one inherited transitively from
    # release-please's own `if:` and `on.push.branches` -- spelled out explicitly here so an
    # edit to either of those (e.g. adding workflow_dispatch, or another push branch) can't
    # silently re-arm this job.
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.release-please.outputs.release_created == 'true'
    timeout-minutes: 10
    # The `if:` above guards this job, not the token: it is text in a file any same-repo branch
    # can edit, and that branch's own copy of this workflow would read a repository secret. The
    # `production` environment admits only `master`, and FLY_API_TOKEN is its secret, so a
    # branch run is refused the token however its workflow is written (#215) -- the same shape
    # as release-please's `release` environment above.
    environment:
      name: production
      # Flipped to the tower.savvagent.com host (docs/deploy/fly.md, "Runbook: move to tower.savvagent.com").
      url: https://tower.savvagent.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only -a otto-factory-mcp
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
