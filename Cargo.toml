[workspace]
resolver = "2"
members = [
  "crates/of-core",
  "crates/of-mcp",
  "crates/of-billing",
  "crates/of-trackers",
  "crates/of-web",
  "crates/of-server",
  "crates/of-testkit",
]

[workspace.package]
version = "0.16.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.88"

[workspace.dependencies]
of-core = { path = "crates/of-core" }
of-mcp = { path = "crates/of-mcp" }
of-billing = { path = "crates/of-billing" }
of-trackers = { path = "crates/of-trackers" }
of-web = { path = "crates/of-web" }
of-testkit = { path = "crates/of-testkit" }

# otto-tower is a resource server of the otto platform (savvagent/otto-factory#192):
# identity, auth, orgs, teams, plans, and billing live there. This repo links only the
# tenant-isolation substrate (`otto-tenant`: pinned transactions, RLS proof, Cipher, the
# audit-trail pattern) and the resource-server client (`otto-resource`: introspection,
# usage shipping, meter declarations, identity lookups, webhook verification).
# `otto-tenant` is at v0.10.0, the release with per-service value meters
# (savvagent/otto-platform#55). `otto-resource` is ahead of it, at the commit of
# savvagent/otto-platform#130, which also accepts the Savvagent `sav_at_`/`sav_pat_` token
# prefixes (savvagent/otto-platform#128): this service must accept them before the platform
# mints them. Do not move it past the change that accepts only `sav_` until this service's
# phase of that epic is live.
otto-tenant = { git = "https://github.com/savvagent/otto-platform", rev = "bfda55e155be8985761850a7c42980cc926fd4cb" }
otto-resource = { git = "https://github.com/savvagent/otto-platform", rev = "03f52e9f2139d08d60d0695b5cde4834f0cf19c2" }

sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "macros", "migrate", "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "set-header"] }
http = "1"
rmcp = { version = "=2.0.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = { version = "1.1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
async-trait = "0.1"
futures = "0.3"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
jsonwebtoken = "9"
# Loads .env for local runs. Never overrides a variable already set, so a
# deployment's real environment always wins over a file that got shipped.
dotenvy = "0.15"

[profile.release]
lto = "thin"
strip = true
