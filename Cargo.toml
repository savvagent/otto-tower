[workspace]
resolver = "2"
members = [
  "crates/tower-core",
  "crates/tower-mcp",
  "crates/tower-billing",
  "crates/tower-trackers",
  "crates/tower-web",
  "crates/tower-server",
  "crates/tower-testkit",
]

[workspace.package]
version = "0.19.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.88"

[workspace.dependencies]
tower-core = { path = "crates/tower-core" }
tower-mcp = { path = "crates/tower-mcp" }
tower-billing = { path = "crates/tower-billing" }
tower-trackers = { path = "crates/tower-trackers" }
tower-web = { path = "crates/tower-web" }
tower-testkit = { path = "crates/tower-testkit" }

# Savvagent Tower is a resource server of the Savvagent platform (savvagent/otto-factory#192):
# identity, auth, orgs, teams, plans, and billing live there. This repo links only the
# tenant-isolation substrate (`savvagent-tenant`: pinned transactions, RLS proof, Cipher, the
# audit-trail pattern) and the resource-server client (`savvagent-resource`: introspection,
# usage shipping, meter declarations, identity lookups, webhook verification).
# Both are pinned to the platform's v0.18.0 (savvagent/otto-platform#128), the release that
# renamed its crates from `otto-*` to `savvagent-*`. That release's `savvagent-resource`
# accepts only the Savvagent `sav_at_`/`sav_pat_` token prefixes, so the platform must be
# minting those before this service ships with this pin.
savvagent-tenant = { git = "https://github.com/savvagent/otto-platform", rev = "063472cdb4eef7229d6732578cf061fd963996a4" }
savvagent-resource = { git = "https://github.com/savvagent/otto-platform", rev = "063472cdb4eef7229d6732578cf061fd963996a4" }

sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "macros", "migrate", "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "set-header"] }
http = "1"
rmcp = { version = "=2.0.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = { version = "1.1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
async-trait = "0.1"
futures = "0.3"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
jsonwebtoken = "9"
# Loads .env for local runs. Never overrides a variable already set, so a
# deployment's real environment always wins over a file that got shipped.
dotenvy = "0.15"

[profile.release]
lto = "thin"
strip = true
