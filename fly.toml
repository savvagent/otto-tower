# otto-tower on Fly.io, org "savvagent". (The Fly app keeps its pre-rename name,
# `otto-factory-mcp`: Fly cannot rename an app slug, and `otto-factory-mcp.fly.dev`
# is the Worker's origin.)
#
# A resource server of the otto platform (https://otto.savvagent.com): identity, OAuth,
# orgs, teams, and billing live there; this app holds only the coordination domain.
#
# Database: database `otto_factory` on `otto-db`, a standalone (unmanaged) Fly
# Postgres app shared with the platform (`otto_platform`) -- shared for cost; split
# onto dedicated instances before real customers, since each app's attach role is a
# superuser on the whole instance. It is unmanaged because the baseline migration
# creates the `otto_app` role, which needs CREATEROLE that the managed `savvagent-pg`
# cluster's per-app roles do not get. The connecting role, created by
# `fly postgres attach`, is a superuser, so it BYPASSES RLS entirely, FORCE included:
# isolation rests wholly on `otto_tenant::Db::begin` issuing `SET LOCAL ROLE otto_app`,
# and any statement that runs directly on the pool (every migration, the usage shipper)
# sees every org's rows. otto-tower keeps its own migration history -- a squashed
# domain-only baseline since the platform cutover -- and never runs the platform's.
#
# Secrets are NOT in this file -- `fly secrets set` puts these in the machine's
# environment (docs/deploy/fly.md):
#   DATABASE_URL                from `fly postgres attach`
#   OF_ENCRYPTION_KEY           openssl rand -base64 32
#   OF_INTROSPECTION_SECRET     otto_rs_...   printed once by the platform's
#                               `otto-platform-server resource register`
#   OF_PLATFORM_WEBHOOK_SECRET  otto_whsec_... printed once by its `resource set-webhook`
# Everything below is configuration a reader is meant to see.

app = "otto-factory-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly's proxy terminates TLS and forwards over the internal network, so the
  # process serves plain HTTP and the public origin is https.
  OF_BIND = "0.0.0.0:8080"
  # The hostname a browser and an agent both see. `otto-factory-mcp.fly.dev`
  # still answers, but nothing advertises it: the discovery pointer in a 401 and
  # the tracker OAuth callbacks are built from OF_PUBLIC_URL.
  #
  # The canonical host since the rename cutover (docs/deploy/fly.md, step 8).
  OF_PUBLIC_URL = "https://otto-tower.savvagent.com"
  # The token audience: exactly the resource_uri registered at the platform
  # (`otto-platform-server resource register <this>`), and the HTTP Basic user on
  # every call this app makes to it. Passkeys are NOT bound to this hostname any
  # more -- they belong to the platform's.
  OF_RESOURCE_URI = "https://otto-tower.savvagent.com/mcp"
  # The pre-rename host, still served with deprecation notices until the sunset.
  # Clear both after `resource drop-alias` (docs/deploy/fly.md, step 11).
  OF_LEGACY_HOSTS = "otto-factory.savvagent.com"
  OF_LEGACY_SUNSET = "2026-10-22T00:00:00Z"
  # The OAuth authorization server, identity directory, and billing system of
  # record. Advertised to MCP clients as this resource's authorization server.
  OF_PLATFORM_URL = "https://savvagent.com"
  # The console's OAuth client at the platform, for console sign-in. NOT a secret
  # (a public client; PKCE is what binds a code to its browser). Printed by
  # `otto-platform-server client register --name "otto-tower console"
  # --redirect-uri https://otto-tower.savvagent.com/auth/callback --first-party`
  # (docs/deploy/fly.md). Unset, `/auth/login` answers 503
  # console_login_disabled and everything else runs.
  OF_CONSOLE_CLIENT_ID = "otto_client_8ClmY61CJPC5BJHULc1Kug15hbSvw0vAy6CxUuXMZUY"
  OF_STATIC_DIR = "/srv/console"
  OF_LOG_FORMAT = "json"
  RUST_LOG = "info,of_server=info,of_mcp=info,of_web=info"

  # If Cloudflare is put in front of this app, OF_ALLOWED_HOSTS has to name this
  # app's own hostname because the Worker's subrequest arrives with it in Host.
  # See docs/deploy/cloudflare.md -- it is not optional and does not fail loudly.

[http_service]
  internal_port = 8080
  # Bearer tokens must never cross the wire in clear.
  force_https = true
  auto_start_machines = true
  # Suspend rather than stop: `watch` is a long poll and an agent waiting on a
  # queue is the normal state, so a cold start on every wake would be a
  # thirty-second stall in the middle of somebody's work.
  auto_stop_machines = "suspend"
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    # /readyz, not /healthz. This check decides whether traffic is routed
    # here, which is the question readiness answers; liveness is a different
    # question and is deliberately not wired to anything that restarts a
    # machine over a database blip.
    path = "/readyz"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    # Migrations run at startup under an advisory lock, so a first boot against
    # a fresh database has DDL to get through before it can answer. Readiness is
    # the database only: a platform outage must not pull a replica out of rotation.
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
